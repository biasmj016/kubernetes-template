apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ${NAMESPACE}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: '${APP_NAME}'
        static_configs:
          - targets: ['${APP_NAME}-service:{{APP_SERVICE_PORT}}']
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['localhost:9100']