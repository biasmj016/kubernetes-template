apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}-deployment
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}
spec:
  replicas: {{APP_REPLICAS}}
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
        - name: ${APP_NAME}-container
          image: ${APP_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: "{{ENVIRONMENT}}"
          resources:
            requests:
              cpu: "{{APP_CPU_REQUEST}}"
              memory: "{{APP_MEMORY_REQUEST}}"
            limits:
              cpu: "{{APP_CPU_LIMIT}}"
              memory: "{{APP_MEMORY_LIMIT}}"
          # 애플리케이션 상태 점검
          livenessProbe:
            httpGet:
              path: /health
              port: {{APP_CONTAINER_PORT}}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{APP_CONTAINER_PORT}}
            initialDelaySeconds: 15
            periodSeconds: 5